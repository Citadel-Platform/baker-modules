<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href` when served below the root. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{baker.appTitle}}">
  <!-- An internal dashboard: not for search engines. See robots.txt. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B121C" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{baker.appTitle}}">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>{{baker.appTitle}}</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The page's background while Flutter loads, so there is no white flash
       before a dark app. */
    html, body { margin: 0; background: #F5F7FA; }
    @media (prefers-color-scheme: dark) { html, body { background: #0B121C; } }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
